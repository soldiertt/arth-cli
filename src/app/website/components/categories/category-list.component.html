<div class="categories">
  <ul class="list-group">
    <li class="list-group-title">{{'common.links.categories' | trans}} <span class="caret"></span></li>
    @for (category of rootCategories$ | async; track category.id) {
      <li class="list-group-item" [routerLink]="['./categ', category.name]">
        <span>{{category | catTitle}}</span>
      </li>
    }
  </ul>
</div>
