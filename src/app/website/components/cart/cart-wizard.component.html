<div id="main" class="cart-wizard">
  <div id="content">
    @if (cartData$ | async; as cartData) {
      <div>
        @if (cartData.wizard.currentStep >= 1) {
          <arth-cart-breadcrumb></arth-cart-breadcrumb>
        }
        @if (cartData.wizard.currentStep !== 3) {
          <arth-mycart></arth-mycart>
        }
        @if (cartData.wizard.currentStep === 3) {
          <arth-confirm-address></arth-confirm-address>
        }
      </div>
    }
    <arth-cart-navigation></arth-cart-navigation>
  </div>
</div>
