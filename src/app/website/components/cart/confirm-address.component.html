<h1>{{'page.profile.title' | trans}}</h1>
@if (profileUpdated) {
  <div class="alert alert-success">{{'page.profile.updatesuccess' | trans}}</div>
}
@if (!editMode) {
  <div>
    <form class="read-details-form" >
      <arth-profile-display (edit)="editAddress()"></arth-profile-display>
    </form>
  </div>
}

@if (editedItem == 'address') {
  <arth-profile-edit (onUpdateMetaData)="updateMetaData()" (onCancelEdit)="cancelEdit()"></arth-profile-edit>
}
