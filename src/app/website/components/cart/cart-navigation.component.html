<div class="cart-nav">
  @if (displayPrevious) {
    <button class="btn previous" (click)="onPrevious()">{{'page.mycart.previous' | trans }}</button>
  }
  @if (displayNext) {
    <button class="btn btn-arth next" (click)="onNext($event)">{{'page.mycart.next' | trans }}</button>
  }
  <div id="paypal-button" [hidden]="!displayPaypalButton"></div>
</div>
@if (processingPayment) {
  <div id="mainLoading">
    <img src="assets/images/ajax-loader.gif" />
  </div>
}
@if (paymentConfirmed) {
  <div class="alert alert-success">{{'page.mycart.paymentsuccess' | trans}}</div>
}
