<form (ngSubmit)="save(f.valid)" #f="ngForm">
  <h2 mat-dialog-title class="d-flex align-items-center justify-content-between">
    @if (!item?.id) {
      <span>Add new slide</span>
    } @else {
      <span>Editing slide</span>
    }
    <button type="button" class="btn-close" aria-label="Close" mat-dialog-close></button>
  </h2>
  <mat-dialog-content>
    @if (item) {
      <div>
        <div class="form-group row mb-2">
          <label for="image" class="col-sm-3 col-form-label">Image *</label>
          <div class="col-sm-9">
            <input #fileUpload type="file" id="image" (change)="onFileChange($event)" required="required" class="form-control">
          </div>
        </div>
        <div class="form-group row mb-2">
          <label for="title1" class="col-sm-3 col-form-label">Title 1</label>
          <div class="col-sm-9">
            <input type="text" id="title1" name="title1" [(ngModel)]="item.title1" class="form-control">
          </div>
        </div>
        <div class="form-group row mb-2">
          <label for="title2" class="col-sm-3 col-form-label">Title 2</label>
          <div class="col-sm-9">
            <input type="text" id="title2" name="title2" [(ngModel)]="item.title2" class="form-control">
          </div>
        </div>
        <div class="form-group row mb-2">
          <label for="description" class="col-sm-3 col-form-label">Description</label>
          <div class="col-sm-9">
            <textarea id="description" name="description" [(ngModel)]="item.description"
            class="form-control"></textarea>
          </div>
        </div>
        <div class="form-group row mb-2">
          <label for="link" class="col-sm-3 col-form-label">Link</label>
          <div class="col-sm-9">
            <input type="text" id="link" name="link" [(ngModel)]="item.link" class="form-control">
          </div>
        </div>
      </div>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button type="submit" class="btn btn-sm btn-success">Save</button>
    <button type="button" class="btn btn-sm btn-link" mat-dialog-close (click)="resetForm()">Cancel</button>
  </mat-dialog-actions>
</form>
