<form (ngSubmit)="save(f.valid)" #f="ngForm">
  <h2 mat-dialog-title class="d-flex align-items-center justify-content-between">
    @if (!item?.id) {
      <span>Add new video</span>
    } @else {
      <span>Editing video</span>
    }
    <button type="button" class="btn-close" aria-label="Close" mat-dialog-close></button>
  </h2>
  <mat-dialog-content>
    @if (item) {
      <div>
        <div class="form-group row mb-2">
          <label for="ref" class="col-sm-3 col-form-label">Youtube ref *</label>
          <div class="col-sm-9">
            <input type="text" id="ref" name="ref" [(ngModel)]="item.ref" class="form-control">
          </div>
        </div>
        <div class="form-group row mb-2">
          <label for="title" class="col-sm-3 col-form-label">Title *</label>
          <div class="col-sm-9">
            <input type="text" id="title" name="title" [(ngModel)]="item.title" class="form-control">
          </div>
        </div>
      </div>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button type="submit" class="btn btn-sm btn-success">Save</button>
    <button type="button" class="btn btn-sm btn-link" mat-dialog-close>Cancel</button>
  </mat-dialog-actions>
</form>
