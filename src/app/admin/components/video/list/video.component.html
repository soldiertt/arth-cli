<div class="p-1">
  <button type="button" class="btn btn-sm btn-secondary"
    (click)="newItem()">
    NEW VIDEO
  </button>
</div>

<!-- VIDEOS -->
<h3>Videos</h3>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Youtube ref</th>
      <th>Title</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (video of videos$ | async; track video.id) {
      <tr>
        <td>{{video.ref}}</td>
        <td>{{video.title}}</td>
        <td>
          <a href (click)="remove($event, video.id)">
            <i class="material-icons">delete_forever</i>
          </a>
        </td>
      </tr>
    }
  </tbody>
</table>
