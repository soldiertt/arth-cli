<div class="p-1">
  <button type="button" class="btn btn-sm btn-secondary"
    (click)="newItem()">
    NEW CATEGORY
  </button>
</div>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>French title</th>
      <th>Dutch title</th>
      <th>Parent</th>
      <th>Ordering</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (category of categories$ | async; track category.id) {
      <tr>
        <td>{{category.name}}</td>
        <td>{{category.titleFr}}</td>
        <td>{{category.titleNl}}</td>
        <td>{{category.parent}}</td>
        <td>{{category.sortby}}</td>
        <td>
          <a href (click)="editItem($event, category)">
            <i class="material-icons">mode_edit</i>
          </a>
          <a href (click)="remove($event, category.id)">
            <i class="material-icons">delete_forever</i>
          </a>
        </td>
      </tr>
    }
  </tbody>
</table>
