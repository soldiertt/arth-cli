<div class="p-1 no-print">
  <button type="button" class="btn btn-sm btn-secondary m-1"
    (click)="newItem()">
    NEW PRODUCT
  </button>
</div>

<form [formGroup]="filterForm">
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Picture</th>
        <th>Category</th>
        <th>Name</th>
        <th class="extra-thin-column">Price</th>
        <th class="thin-column no-print">Actions</th>
      </tr>
      <tr class="no-print">
        <td></td>
        <td>
          <select name="categoryfilter" id="categoryfilter" class="form-control form-control-sm" formControlName="categoryFilter">
            <option value="">[Category]</option>
            @for (category of categories; track category.code) {
              <option [value]="category.code">{{category.name}}</option>
            }
          </select>
        </td>
        <td></td>
        <td></td>
        <td class="thin-column"></td>
      </tr>
    </thead>
    <tbody>
      @for (product of filteredProducts$ | async; track product.id) {
        <tr>
          <td>
            @for (pic of picUtil.allMiniPicturesFullPath(product); track pic) {
              <img [src]="pic">
            }
          </td>
          <td>{{product.type}}</td>
          <td>{{product.name}}</td>
          <td class="extra-thin-column">
            {{product.price}}€
          </td>
          <td class="thin-column no-print">
            <a href (click)="editItem($event, product)">
              <i class="material-icons">mode_edit</i>
            </a>
            <a href (click)="remove($event, product.id)">
              <i class="material-icons">delete_forever</i>
            </a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</form>
