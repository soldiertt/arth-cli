<form (ngSubmit)="save(f.valid)" #f="ngForm">
  <h2 mat-dialog-title class="d-flex align-items-center justify-content-between">
    <span>Add new brand</span>
    <button type="button" class="btn-close" aria-label="Close" mat-dialog-close></button>
  </h2>
  <mat-dialog-content>
    @if (item) {
      <div>
        <div class="form-group row">
          <label for="name" class="col-sm-3 col-form-label">Name *</label>
          <div class="col-sm-9">
            <input type="text" id="name" name="name" [(ngModel)]="item.brand"
              placeholder="brand name" required="required" class="form-control">
          </div>
        </div>
      </div>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button type="submit" class="btn btn-sm btn-success">Save</button>
    <button type="button" class="btn btn-sm btn-link" mat-dialog-close>Cancel</button>
  </mat-dialog-actions>
</form>
