<div class="p-1">
  <button type="button" class="btn btn-sm btn-secondary"
    (click)="newItem()">
    NEW BRAND
  </button>
</div>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (brand of brands$ | async; track brand.id) {
      <tr>
        <td>{{brand.brand}}</td>
        <td><a href (click)="remove($event, brand.id)"><i class="material-icons">delete_forever</i></a></td>
      </tr>
    }
  </tbody>
</table>
